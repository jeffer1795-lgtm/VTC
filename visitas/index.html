<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>VTC · Formato de Visita Técnica — SI-SI-LP-004-2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{
  /* ---------- Tokens · sistema visual ---------- */
  --bg:#FAF9F5;            /* fondo exterior crema */
  --panel:#FFFFFF;
  --ink:#1F1F24;           /* texto principal carbón */
  --muted:#6E717A;         /* texto secundario */
  --muted-2:#8E929B;
  --line:#EFEFF2;
  --surface:#F4F4F6;       /* superficie neutra (buscador, botones) */
  --brand:#FBD437;         /* amarillo primario */
  --brand-strong:#F5C400;  /* ámbar acento */
  --brand-soft:#FFF3B8;    /* amarillo pastel */
  --brand-soft-2:#FEF4C5;
  --accent:#8A6A00;        /* ámbar legible para texto */
  --accent2:#F5C400;
  --ok:#1E8449; --warn:#8A6A00; --bad:#C8102E;
  --r-card:18px; --r-ctrl:12px; --r-pill:9999px;
  --shadow-card:0 6px 18px rgba(31,31,36,.08);
  --shadow-soft:0 2px 10px rgba(31,31,36,.05);
  --shadow-float:0 10px 30px rgba(31,31,36,.14);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);overflow-x:hidden;
  font:14px/1.45 "Plus Jakarta Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:1080px;margin:0 auto}

/* ---------- Barra superior ---------- */
header.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(255,255,255,.94);backdrop-filter:saturate(180%) blur(10px);
  color:var(--ink);border-bottom:1px solid var(--line);
  display:flex;gap:12px;align-items:center;justify-content:space-between;
  padding:12px 18px;flex-wrap:wrap;box-shadow:0 1px 10px rgba(31,31,36,.05);
}
.brand{font-weight:800;letter-spacing:-.2px;font-size:15px;line-height:1.2;display:flex;align-items:center;gap:9px}
.brand::before{
  content:"";width:30px;height:30px;border-radius:10px;flex:0 0 auto;
  background:radial-gradient(circle at 30% 30%,#FFE680,var(--brand) 60%,var(--brand-strong));
  box-shadow:0 4px 10px rgba(251,212,55,.45), inset 0 0 0 1px rgba(31,31,36,.06);
}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.2px;margin-top:2px}
.topactions{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- Botones ---------- */
button{
  font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--line);
  background:#fff;color:var(--ink);border-radius:var(--r-ctrl);
  padding:8px 14px;transition:background .16s,border-color .16s,box-shadow .16s,transform .12s;
  line-height:1.2;
}
button:hover{background:#FFFBEA;border-color:var(--brand)}
button:active{transform:translateY(1px)}
button.primary{
  background:var(--brand);border-color:var(--brand);color:var(--ink);font-weight:700;
  box-shadow:0 6px 14px rgba(251,212,55,.38);
}
button.primary:hover{background:var(--brand-strong);border-color:var(--brand-strong)}
button.ghost{background:var(--surface);border-color:var(--surface);color:var(--ink)}
button.ghost:hover{background:var(--brand-soft);border-color:var(--brand-soft)}
button.mini{padding:4px 10px;font-size:12px;border-radius:10px;font-weight:600}
button.danger{color:var(--bad);border-color:#F3C9CE;background:#fff}
button.danger:hover{background:#FDEEF0;border-color:var(--bad)}

/* ---------- Paneles ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-card);
  padding:16px 18px;margin:14px 16px;box-shadow:var(--shadow-soft)}
.panel h2{font-size:16px;line-height:1.3;margin:0 0 14px;color:var(--ink);font-weight:800;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;letter-spacing:-.2px}
.panel h2::before{content:"";width:4px;height:18px;border-radius:999px;background:var(--brand);flex:0 0 auto}
.panel h4{font-size:12px;margin:20px 0 9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.06em;font-weight:700}
.spacer{flex:1}
.badge{background:var(--brand-soft);color:#6B5200;font-size:11px;font-weight:700;
  padding:4px 10px;border-radius:var(--r-pill);letter-spacing:.2px}
.badge.alt{background:#EAF6EE;color:var(--ok)}
.muted{color:var(--muted);font-size:12.5px}
.note{background:#FFFBEA;border-left:4px solid var(--brand);padding:10px 12px;
  border-radius:8px var(--r-ctrl) var(--r-ctrl) 8px;font-size:12px;color:#6B5200;margin-top:12px;line-height:1.45}

/* ---------- Formularios ---------- */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
label{display:flex;flex-direction:column;gap:5px;font-size:11px;color:var(--muted);
  font-weight:600;letter-spacing:.2px}
label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500;color:var(--ink);font-size:13px}
input,select,textarea{font:inherit;font-weight:400;color:var(--ink);border:1px solid #E6E6EA;
  border-radius:var(--r-ctrl);padding:9px 12px;background:#fff;width:100%;transition:.15s}
input::placeholder,textarea::placeholder{color:var(--muted-2)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-strong);
  box-shadow:0 0 0 3px rgba(251,212,55,.30)}
input[readonly]{background:var(--surface);color:#55585F}
input:disabled,select:disabled,textarea:disabled{background:#F7F7F9;color:#A5A8AF;cursor:not-allowed}
textarea{min-height:64px;resize:vertical;font-size:13px;line-height:1.5}
input[type=checkbox]{width:auto;transform:scale(1.2);cursor:pointer;accent-color:var(--brand-strong)}

/* ---------- Tablas ---------- */
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain;
  border-radius:var(--r-ctrl);border:1px solid var(--line);background:#fff}
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px;min-width:520px}
table.tbl th{background:#F7F7F9;text-align:left;padding:9px 10px;border:none;
  font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
  font-weight:700;white-space:nowrap}
table.tbl td{border:none;border-top:1px solid var(--line);padding:4px 5px;vertical-align:middle}
table.tbl td input,table.tbl td select{border:none;padding:6px 7px;background:transparent;border-radius:8px;font-size:12.5px}
table.tbl td input:focus,table.tbl td select:focus{outline:none;box-shadow:0 0 0 2px rgba(251,212,55,.45);background:#fff}
table.tbl tbody tr:hover{background:#FCFCFD}
table.tbl tr.presente{background:#FFFBEA}
table.tbl tr.presente:hover{background:#FFF7D6}

/* ---------- Chips ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 14px}
.chip{border-radius:var(--r-pill);padding:7px 14px;font-size:12.5px;font-weight:600;
  background:var(--surface);border:1px solid transparent;color:var(--ink)}
.chip:hover{background:var(--brand-soft);border-color:var(--brand)}
.chip .c{opacity:.65;font-size:11px;margin-left:6px;font-weight:500}
.chip.new{background:#fff;border-style:dashed;color:var(--muted);border-color:#D9D9E0}
.chip.new:hover{color:var(--ink);border-color:var(--brand)}

/* ---------- Pestañas ---------- */
.tabs{display:flex;gap:8px;padding:12px 16px 0;flex-wrap:wrap;max-width:1080px;margin:0 auto}
.tab{border-radius:var(--r-ctrl);padding:9px 16px;font-size:13px;font-weight:600;
  background:var(--surface);border-color:transparent;border:1px solid transparent;color:#4A4D55}
.tab:hover{background:#FFFBEA;border-color:var(--brand)}
.tab.active{background:var(--brand);color:var(--ink);font-weight:700;box-shadow:var(--shadow-soft)}
.tab.add{background:transparent;border:1px dashed #C9C9D2;color:var(--muted)}
.tab.add:hover{background:var(--brand-soft);border-style:solid;border-color:var(--brand)}

.hidden{display:none!important}

/* ---------- Checklist ---------- */
.check-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:8px}
.check-item{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);
  border-radius:var(--r-ctrl);background:#FAF9F5;font-size:13px;cursor:pointer;transition:.15s}
.check-item:hover{border-color:var(--brand)}
.check-item.on{background:var(--brand-soft);border-color:var(--brand-strong)}
.check-item input{margin-top:2px}

/* ---------- Fotos / firmas ---------- */
.thumb{max-width:74px;max-height:74px;border-radius:10px;border:1px solid var(--line);display:block;object-fit:cover}
.thumb.sign{width:130px;height:54px;object-fit:contain;background:#fff;cursor:pointer;border-radius:10px}

/* ---------- Clima ---------- */
.clima-bar{display:flex;gap:8px;align-items:stretch}
.clima-bar input{flex:1;min-width:0}
.clima-bar button{flex:0 0 auto}
.clima-box{margin-top:12px}
.clima-head{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin-bottom:10px}
.clima-head b{font-size:13.5px}
.clima-head .muted{font-size:11.5px}
.clima-metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px;margin-bottom:12px}
.metric{background:var(--brand-soft-2);border-radius:var(--r-ctrl);padding:10px 8px;text-align:center}
.metric b{display:block;font-size:15px;font-weight:800;line-height:1.2}
.metric small{display:block;font-size:10px;color:#6B5200;margin-top:2px;font-weight:600;letter-spacing:.02em}
.metric .ico{font-size:16px;line-height:1;display:block;margin-bottom:4px}
.clima-tbl td:first-child{color:var(--muted);width:58%}
.clima-tbl td:last-child{font-weight:600;text-align:right}
.clima-tbl{min-width:0}
.clima-src{font-size:10.5px;color:var(--muted-2);margin-top:8px}
.clima-src a{color:var(--accent);font-weight:600}

/* ---------- Proyectos ---------- */
.project-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px;margin-top:16px}
.project-card{border:1px solid var(--line);border-radius:var(--r-card);padding:16px;cursor:pointer;
  background:#fff;transition:.16s;box-shadow:var(--shadow-soft)}
.project-card:hover{border-color:var(--brand);box-shadow:var(--shadow-card);transform:translateY(-2px)}
.proj-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
.proj-num{font-weight:800;color:var(--ink);font-size:15px;line-height:1.2;letter-spacing:-.2px}
.proj-row{font-size:12.5px;margin:4px 0;line-height:1.4;color:#3D4047}
.proj-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:11px}

/* ---------- Modal ---------- */
.modal{position:fixed;inset:0;background:rgba(31,31,36,.45);backdrop-filter:blur(2px);
  display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
.modal.open{display:flex}
.modal-box{background:#fff;border-radius:24px;max-width:560px;width:100%;max-height:88vh;overflow:auto;
  padding:24px;box-shadow:0 24px 60px rgba(31,31,36,.30)}
.modal-box.signature{max-width:680px;padding:18px}
.modal-box h3{margin:0 0 16px;font-size:17px;color:var(--ink);font-weight:800;letter-spacing:-.2px}
.modal-box label{margin-bottom:12px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;flex-wrap:wrap}
.hist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;
  border-bottom:1px solid var(--line);font-size:13px}
.hist-actions{display:flex;gap:6px}

/* ---------- Firma digital ---------- */
.sign-wrap{display:flex;flex-direction:column;gap:14px}
#signCanvas{width:100%;height:300px;border:2px dashed #E2E2E8;border-radius:16px;background:#fff;
  touch-action:none;cursor:crosshair;display:block}
.sign-actions{display:flex;gap:12px}
.sign-actions button{flex:1;padding:16px;font-size:16px;font-weight:700;border-radius:14px;min-height:54px}
.sign-actions .exit{background:#fff;color:var(--bad);border:2px solid #F3C9CE}
.sign-actions .exit:hover{background:#FDEEF0;border-color:var(--bad)}
.sign-actions .save{background:var(--brand);color:var(--ink);border:2px solid var(--brand);
  box-shadow:0 8px 18px rgba(251,212,55,.40)}
.sign-actions .save:hover{background:var(--brand-strong);border-color:var(--brand-strong)}

/* ---------- Barra inferior móvil ---------- */
.mobile-bottom-nav{display:none}

/* ---------- Toast ---------- */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;padding:11px 20px;border-radius:var(--r-pill);
  opacity:0;pointer-events:none;transition:.28s;z-index:300;font-size:13px;max-width:90vw;
  box-shadow:var(--shadow-float)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Impresión ---------- */
@media print{
  @page{margin:12mm}
  .no-print,.topactions,.tabs,.chips,#toast,.modal,.mobile-bottom-nav,.clima-bar button{display:none!important}
  body{background:#fff;font-size:10.5px}
  header.topbar{position:static;background:#fff;color:#000;box-shadow:none;border-bottom:2px solid #000;padding:6px 0}
  .brand::before{display:none}
  .panel{margin:6px 0;padding:8px 10px;box-shadow:none;border:1px solid #bbb;break-inside:avoid;border-radius:6px}
  .panel h2::before{display:none}
  .front{display:block!important;page-break-after:always}
  .front:last-child{page-break-after:auto}
  .hidden{display:block!important}
  input,select,textarea{border:1px solid #bbb!important;background:#fff!important;box-shadow:none!important}
  table.tbl td input,table.tbl td select{border:none!important}
  .thumb{max-width:90px;max-height:90px}
  .tbl-wrap{border:none}
  .metric{background:#fff!important;border:1px solid #ccc}
}

/* ---------- Móvil ---------- */
@media(max-width:700px){
  body{font-size:15px;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
  header.topbar{position:sticky;padding:10px 12px;gap:8px;justify-content:flex-start;flex-wrap:nowrap}
  .brand{font-size:13px;min-width:0;flex:1 1 auto}
  .brand small{display:none}
  .topactions{gap:6px;flex:0 0 auto;max-width:58%;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;padding-bottom:2px}
  .topactions::-webkit-scrollbar{display:none}
  .topactions button{white-space:nowrap;flex:0 0 auto;font-size:12px;padding:8px 11px}
  .tabs{flex-wrap:nowrap;overflow-x:auto;padding:10px 12px 8px;scrollbar-width:none;background:var(--bg)}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto}
  .panel{margin:10px 10px;padding:14px 13px;border-radius:16px}
  .grid2,.grid3{grid-template-columns:1fr;gap:10px}
  input,select,textarea{font-size:16px;min-height:46px;padding:10px 12px}
  textarea{min-height:92px}
  button{min-height:44px}
  .clima-metrics{grid-template-columns:repeat(2,1fr)}
  .chips{gap:8px}.chip{padding:10px 14px}
  .tbl-wrap{border-radius:12px}
  .mobile-bottom-nav{
    position:fixed;z-index:70;left:0;right:0;bottom:0;display:flex;gap:6px;overflow-x:auto;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:rgba(255,255,255,.97);
    backdrop-filter:blur(10px);border-top:1px solid var(--line);box-shadow:0 -4px 18px rgba(31,31,36,.10);
    scrollbar-width:none;
  }
  .mobile-bottom-nav::-webkit-scrollbar{display:none}
  .mobile-bottom-nav button{flex:1 0 auto;white-space:nowrap;font-size:12px;padding:10px 12px;
    border-radius:var(--r-pill);border-color:transparent;background:var(--surface)}
  .mobile-bottom-nav button.active{background:var(--brand);color:var(--ink);font-weight:700}
  .project-grid{grid-template-columns:1fr}
  #signCanvas{height:240px}
  .sign-actions{flex-direction:column-reverse}
  .sign-actions button{padding:15px;font-size:15px}
  .modal-box{padding:18px;border-radius:20px;max-height:92vh}
  .modal-actions{flex-direction:column-reverse}
  .modal-actions button{width:100%}
}

</style>
</head>

const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=>Math.random().toString(36).slice(2,9);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = ()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};
const horaActual = ()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');};
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function diaSemana(fecha){
  const d = new Date(fecha+'T12:00:00');
  return isNaN(d) ? '' : DIAS[d.getDay()];
}
function opts(list, sel){
  const s = String(sel ?? '');
  return list.map(v=>`<option value="${esc(v)}"${String(v)===s?' selected':''}>${v===''?'—':esc(v)}</option>`).join('');
}
function toast(msg, ms=2600){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), ms);
}

let DB = loadDB() || {};

function migrateOldDB(){
  if(DB.jornada && !DB.projects){
    const proj = {
      id: uid(),
      numeroProceso: 'SI-SI-LP-004-2025',
      contratista: 'CONSORCIO A.P. CVU',
      interventoria: 'Universidad de Pamplona / ITAF S.A.S.',
      ingenierosVtc: [Object.assign({id: uid()}, DEFAULT_ING)],
      jornada: DB.jornada,
      history: DB.history || [],
      createdAt: new Date().toISOString()
    };
    DB.projects = [proj];
    DB.activeProjectId = proj.id;
    delete DB.jornada;
    delete DB.history;
  }
}

function initDB(){
  migrateOldDB();
  if(!Array.isArray(DB.projects)) DB.projects = [];

  /* Cada proyecto es independiente: el catálogo de profesionales vive dentro del proyecto.
     Se migra el catálogo global antiguo al proyecto SI-SI-LP-004-2025 (o al activo). */
  const legacy = DB.catalogs;
  const legacyTieneDatos = legacy && ((legacy.contratista || []).length || (legacy.interventoria || []).length);
  if(legacyTieneDatos){
    const destino = DB.projects.find(p=>/SI-SI-LP-004-2025/i.test(p.numeroProceso || ''))
                 || DB.projects.find(p=>p.id === DB.activeProjectId)
                 || DB.projects[0];
    if(destino && !destino.catalogs){
      destino.catalogs = {
        contratista: JSON.parse(JSON.stringify(legacy.contratista || [])),
        interventoria: JSON.parse(JSON.stringify(legacy.interventoria || []))
      };
    }
  }
  delete DB.catalogs;

  DB.projects.forEach(p=>{
    if(!Array.isArray(p.ingenierosVtc) || !p.ingenierosVtc.length)
      p.ingenierosVtc = [Object.assign({id: uid()}, DEFAULT_ING)];
    if(!p.jornada) p.jornada = blankJornada();
    if(!Array.isArray(p.history)) p.history = [];
    const esSI = /SI-SI-LP-004-2025/i.test(p.numeroProceso || '');
    if(!p.catalogs || typeof p.catalogs !== 'object') p.catalogs = {};
    if(!Array.isArray(p.catalogs.contratista)) p.catalogs.contratista = [];
    if(!Array.isArray(p.catalogs.interventoria))
      p.catalogs.interventoria = esSI ? seedInterventoria() : [];
    if(!Array.isArray(p.jornada.fronts) || !p.jornada.fronts.length)
      p.jornada.fronts = [newFront(1)];
    if(!p.jornada.checklist) p.jornada.checklist = {};
    p.jornada.fronts.forEach(f=>{
      if(!Array.isArray(f.personalOperativo)) f.personalOperativo = [];
      if(typeof f.obsB !== 'string') f.obsB = '';
      if(typeof f.obsC !== 'string') f.obsC = '';
      if(typeof f.obsOperativo !== 'string') f.obsOperativo = '';
      if(!Array.isArray(f.negativas)) f.negativas = [];
      if(f.climaData === undefined) f.climaData = null;
      // Firmas: una sola casilla por defecto; las demás se agregan a demanda
      if(!Array.isArray(f.firmas) || !f.firmas.length) f.firmas = [blankFirma()];
      else{
        const vacia = v => !v.nombre && !v.tarjeta && !v.firmaImg && (!v.rol || ROLES_FIRMA.includes(v.rol));
        if(f.firmas.length > 1 && f.firmas.slice(1).every(vacia))
          f.firmas = [vacia(f.firmas[0]) ? blankFirma() : f.firmas[0]];
        f.firmas.forEach(v => Object.assign(v, {rol:v.rol||'', nombre:v.nombre||'', tarjeta:v.tarjeta||'', firma:v.firma||'', firmaImg:v.firmaImg||'', hora:v.hora||''}));
      }
    });
  });

  if(!DB.activeProjectId || !DB.projects.find(p=>p.id===DB.activeProjectId))
    DB.activeProjectId = null;
}

let saveTimer = null;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persist, 350);
}
function persist(){
  try{
    localStorage.setItem(LS_KEY, JSON.stringify(DB));
    return true;
  }catch(e){
    console.error(e);
    toast('⚠ No se pudo guardar: almacenamiento lleno. Exporte el JSON y elimine fotos.', 6000);
    return false;
  }
}
function forzarGuardado(){
  clearTimeout(saveTimer);
  if(persist()) toast('✔ Datos guardados');
}

function getActiveProject(){
  return DB.projects.find(p=>p.id===DB.activeProjectId) || null;
}
/* Catálogo de profesionales del proyecto activo (independiente por proyecto) */
function CAT(){
  const p = getActiveProject();
  if(!p) return {contratista:[], interventoria:[]};
  if(!p.catalogs) p.catalogs = {contratista:[], interventoria:[]};
  if(!Array.isArray(p.catalogs.contratista)) p.catalogs.contratista = [];
  if(!Array.isArray(p.catalogs.interventoria)) p.catalogs.interventoria = [];
  return p.catalogs;
}
function J(){
  const p = getActiveProject();
  return p ? p.jornada : null;
}
function getCurrentEngineer(){
  const p = getActiveProject();
  if(!p) return null;
  return p.ingenierosVtc.find(e=>e.id===p.jornada.engineId) || p.ingenierosVtc[0];
}

/* --- GPS --- */
function gpsInto(fi, field){
  if(!navigator.geolocation){toast('Este dispositivo no ofrece ubicación GPS');return;}
  toast('Solicitando ubicación…');
  navigator.geolocation.getCurrentPosition(pos=>{
    updFront(fi, field, `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`);
    render(); toast('Coordenadas agregadas');
  }, err=>toast(err.code===1?'Permite el acceso a ubicación para usar el GPS':'No se pudo obtener el GPS; revisa señal y permisos'),
  {enableHighAccuracy:true,timeout:20000,maximumAge:0});
}

/* --- Fotos --- */
function compressImage(file, maxW=640, q=0.5){
  return new Promise((res, rej)=>{
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = ()=>{
      const scale = Math.min(1, maxW / img.width);
      const c = document.createElement('canvas');
      c.width  = Math.round(img.width * scale);
      c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = (e)=>{ URL.revokeObjectURL(url); rej(e); };
    img.src = url;
  });
}

async function setFoto(fi, ri, input){
  const file = input.files && input.files[0];
  if(!file) return;
  try{
    const dataUrl = await compressImage(file);
    const f = J().fronts[fi];
    f.fotos[ri].img = dataUrl;
    f.fotos[ri].archivo = file.name;
    if(!f.fotos[ri].hora) f.fotos[ri].hora = horaActual();
    if(!f.fotos[ri].coord && f.coordenadas) f.fotos[ri].coord = f.coordenadas;
    render(); save();
    toast('Foto adjuntada (comprimida)');
  }catch(e){ alert('No se pudo procesar la imagen.'); }
}

/* =========================================================
   FIRMA DIGITAL (canvas)
   ========================================================= */
let signFi = -1, signRi = -1, signCanvas = null, signCtx = null;

function openSignature(fi, ri){
  signFi = fi; signRi = ri;
  const f = J().fronts[fi];
  const fm = f.firmas[ri];

  $('#modalBox').className = 'modal-box signature';
  $('#modalBox').innerHTML = `
    <h3>Firma digital</h3>
    <div class="sign-wrap">
      <canvas id="signCanvas"></canvas>
      <div class="sign-actions">
        <button class="exit" onclick="closeModal()">✕ Salir</button>
        <button class="save" onclick="saveSignature()">✓ Guardar firma</button>
      </div>
    </div>
  `;
  $('#modal').classList.add('open');

  requestAnimationFrame(()=>{
    const canvas = document.getElementById('signCanvas');
    if(!canvas) return;
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.fillStyle = '#fff';
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2.2;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    signCanvas = canvas;
    signCtx = ctx;

    if(fm.firmaImg){
      const img = new Image();
      img.onload = ()=>ctx.drawImage(img, 0, 0, rect.width, rect.height);
      img.src = fm.firmaImg;
    }

    let drawing = false, lx = 0, ly = 0;
    const pos = e => {
      const r = canvas.getBoundingClientRect();
      const t = e.touches ? e.touches[0] : e;
      return { x: t.clientX - r.left, y: t.clientY - r.top };
    };
    const start = e => { e.preventDefault(); drawing = true; const p = pos(e); lx = p.x; ly = p.y; };
    const move = e => {
      if(!drawing) return;
      e.preventDefault();
      const p = pos(e);
      ctx.beginPath();
      ctx.moveTo(lx, ly);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
      lx = p.x; ly = p.y;
    };
    const end = () => { drawing = false; };

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end);
  });
}

function saveSignature(){
  if(!signCanvas || signFi < 0){ closeModal(); return; }
  const dataUrl = signCanvas.toDataURL('image/jpeg', 0.85);
  const f = J().fronts[signFi];
  f.firmas[signRi].firmaImg = dataUrl;
  f.firmas[signRi].firma = 'Firmado';
  if(!f.firmas[signRi].hora) f.firmas[signRi].hora = horaActual();
  save();
  const fi = signFi, ri = signRi;
  closeModal();
  render();
  toast('Firma guardada');
}

  draft.contratista   = document.getElementById('pCont').value.trim();
  draft.interventoria = document.getElementById('pInt').value.trim();
  draft.ingenierosVtc = draft.ingenierosVtc.filter(e=>e.nombre.trim());

  if(!draft.numeroProceso){ alert('El número de proceso es obligatorio.'); return; }
  if(!draft.ingenierosVtc.length) draft.ingenierosVtc.push(Object.assign({id: uid()}, DEFAULT_ING));

  if(id){
    const idx = DB.projects.findIndex(p=>p.id===id);
    if(idx > -1){
      // Preserve jornada & history
      draft.jornada = DB.projects[idx].jornada;
      draft.history = DB.projects[idx].history;
      DB.projects[idx] = draft;
    }
  } else {
    DB.projects.push(draft);
    DB.activeProjectId = draft.id;
  }
  initDB();
  closeModal(); save(); render();
  toast(id ? 'Proyecto actualizado' : 'Proyecto creado');
}

function deleteProject(id){
  if(!confirm('¿Eliminar este proyecto y todo su contenido? No se puede deshacer.')) return;
  DB.projects = DB.projects.filter(p=>p.id!==id);
  if(DB.activeProjectId === id) DB.activeProjectId = null;
  save(); render();
  toast('Proyecto eliminado');
}

/* =========================================================
   HISTORIAL
   ========================================================= */
function archivarActual(){
  const proj = getActiveProject();
  if(!proj) return;
  const j = proj.jornada;
  const tieneDatos = j.fronts.some(f =>
    f.direccion || f.actividades.length || Object.keys(f.contratista).length ||
    Object.keys(f.interventoria).length || f.hallazgos.length
  );
  if(!tieneDatos) return;
  proj.history.unshift(JSON.parse(JSON.stringify(j)));
  if(proj.history.length > 40) proj.history.pop();
}

function nuevaJornada(repetirEstructura){
  const proj = getActiveProject();
  if(!proj) return;
  const msg = repetirEstructura
    ? 'Se creará una jornada nueva copiando los frentes y el personal marcado presente (sin horas ni actividades). ¿Continuar?'
    : 'La jornada actual se archivará en el historial y se iniciará una nueva. ¿Continuar?';
  if(!confirm(msg)) return;

  archivarActual();
  const prev = proj.jornada;
  const nueva = blankJornada();
  nueva.engineId = prev.engineId;
  nueva.acompanantes = prev.acompanantes || '';

  if(repetirEstructura){
    nueva.fronts = prev.fronts.map((f, i)=>{
      const nf = newFront(i+1);
      nf.nombre = f.nombre;
      nf.direccion = f.direccion;
      nf.coordenadas = f.coordenadas;
      Object.keys(f.contratista).forEach(id=>{
        if(f.contratista[id].presente) nf.contratista[id] = {presente:true, hora:'', actividad:'', obs:''};
      });
      Object.keys(f.interventoria).forEach(id=>{
        if(f.interventoria[id].presente) nf.interventoria[id] = {presente:true, hora:'', actividad:'', obs:'', justificacion:''};
      });
      return nf;
    });
    if(!nueva.fronts.length) nueva.fronts = [newFront(1)];
  }

  proj.jornada = nueva;
  activeTab = 0;
  save(); render();
  toast(repetirEstructura ? 'Jornada creada con la misma estructura' : 'Nueva jornada iniciada');
}

function showHistory(){
  const proj = getActiveProject();
  if(!proj) return;
  const h = proj.history || [];
  const body = h.length
    ? h.map((j,i)=>`
        <div class="hist-row">
          <div>
            <b>${esc(j.fecha)}</b> · ${esc(j.acompanantes || '—')} · ${j.fronts.length} frente(s)
            <div class="muted">${esc(j.fronts.map(f=>f.nombre).join(' · '))}</div>
          </div>
          <div class="hist-actions">
            <button class="mini" onclick="loadHist(${i})">Cargar</button>
            <button class="mini danger" onclick="delHist(${i})">✕</button>
          </div>
        </div>`).join('')
    : '<p class="muted">Todavía no hay jornadas archivadas en este proyecto.</p>';
  showModal(`<h3>Historial del proyecto</h3>${body}
    <div class="modal-actions"><button onclick="closeModal()">Cerrar</button></div>`);
}

function loadHist(i){
  const proj = getActiveProject();
  if(!proj) return;
  if(!confirm('¿Cargar esta jornada? La jornada actual se archivará en el historial.')) return;
  archivarActual();
  proj.jornada = JSON.parse(JSON.stringify(proj.history[i]));
  proj.history.splice(i,1);
  activeTab = 0;
  closeModal(); save(); render();
  toast('Jornada cargada');
}

function delHist(i){
  const proj = getActiveProject();
  if(!proj) return;
  if(!confirm('¿Eliminar esta jornada del historial?')) return;
  proj.history.splice(i,1);
  save(); showHistory();
}

   ========================================================= */
function exportJSON(){
  const data = {
    version: '2.1',
    exportedAt: new Date().toISOString(),
    projects: DB.projects
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'VTC_' + hoy() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('Respaldo JSON exportado');
}

function importJSON(input){
  const file = input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!data.projects && !data.jornada) throw new Error('Estructura no válida');
      if(!confirm('¿Reemplazar TODOS los datos actuales con el archivo importado?')) return;
      if(data.jornada && !data.projects){ DB = data; }
      else { DB = { projects: data.projects, catalogs: data.catalogs, activeProjectId: null }; }
      initDB();
      DB.activeProjectId = DB.projects[0]?.id || null;
      activeTab = 0;
      save(); render();
      toast('Datos importados correctamente');
    }catch(e){
      alert('El archivo no es un respaldo VTC válido.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

/* =========================================================
   CLIMA · consulta meteorológica del área exacta del frente
   ========================================================= */
const WMO = {
  0:['Despejado','☀️'], 1:['Mayormente despejado','🌤️'], 2:['Parcialmente nublado','⛅'],
  3:['Nublado','☁️'], 45:['Niebla','🌫️'], 48:['Niebla con escarcha','🌫️'],
  51:['Llovizna ligera','🌦️'], 53:['Llovizna moderada','🌦️'], 55:['Llovizna intensa','🌦️'],
  56:['Llovizna helada ligera','🌧️'], 57:['Llovizna helada intensa','🌧️'],
  61:['Lluvia ligera','🌦️'], 63:['Lluvia moderada','🌧️'], 65:['Lluvia fuerte','🌧️'],
  66:['Lluvia helada ligera','🌧️'], 67:['Lluvia helada fuerte','🌧️'],
  71:['Nevada ligera','🌨️'], 73:['Nevada moderada','🌨️'], 75:['Nevada fuerte','🌨️'], 77:['Granos de nieve','🌨️'],
  80:['Chubascos ligeros','🌦️'], 81:['Chubascos moderados','🌧️'], 82:['Chubascos violentos','⛈️'],
  85:['Chubascos de nieve','🌨️'], 86:['Chubascos de nieve fuertes','🌨️'],
  95:['Tormenta','⛈️'], 96:['Tormenta con granizo','⛈️'], 99:['Tormenta fuerte con granizo','⛈️']
};
function wmo(code){ return WMO[code] || ['Condición ' + (code ?? '—'), '🌡️']; }
function nClima(v, dec = 1){
  if(v === null || v === undefined || v === '' || isNaN(v)) return '—';
  return Number(v).toFixed(dec).replace(/\.0$/, '');
}
function dirViento(deg){
  if(deg === null || deg === undefined || isNaN(deg)) return '—';
  const d = ['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSO','SO','OSO','O','ONO','NO','NNO'];
  return d[Math.round(((Number(deg) % 360) / 22.5)) % 16];
}
function nivelUV(uv){
  if(uv === null || uv === undefined || isNaN(uv)) return '';
  const v = Number(uv);
  if(v < 3) return ' · bajo';
  if(v < 6) return ' · moderado';
  if(v < 8) return ' · alto';
  if(v < 11) return ' · muy alto';
  return ' · extremo';
}
function frenteActivo(){
  const j = J();
  if(!j) return null;
  const i = (typeof activeTab === 'number' && j.fronts[activeTab]) ? activeTab : 0;
  return {fi:i, f:j.fronts[i]};
}
function parseCoords(txt){
  const m = String(txt || '').match(/(-?\d{1,3}(?:\.\d+)?)\s*[,;]\s*(-?\d{1,3}(?:\.\d+)?)/);
  if(!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  if(Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return {lat, lon};
}
function geoPos(){
  return new Promise((res, rej)=>{
    if(!navigator.geolocation) return rej(new Error('sin GPS'));
    navigator.geolocation.getCurrentPosition(
      p => res({lat:p.coords.latitude, lon:p.coords.longitude}),
      e => rej(e),
      {enableHighAccuracy:true, timeout:20000, maximumAge:60000}
    );
  });
}

async function fetchClima(lat, lon){
  const qs = new URLSearchParams({
    latitude: lat,
    longitude: lon,
    current: 'temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,cloud_cover,pressure_msl,wind_speed_10m,wind_direction_10m,wind_gusts_10m',
    hourly: 'precipitation_probability,uv_index,visibility',
    daily: 'temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset,uv_index_max',
    timezone: 'auto',
    forecast_days: '2',
    wind_speed_unit: 'kmh'
  });
  const res = await fetch('https://api.open-meteo.com/v1/forecast?' + qs.toString(), {cache:'no-store'});
  if(!res.ok) throw new Error('Open-Meteo HTTP ' + res.status);
  const d = await res.json();
  const cur = d.current || {}, hourly = d.hourly || {}, daily = d.daily || {};
  const hora = String(cur.time || '').slice(0, 13);
  let idx = (hourly.time || []).findIndex(t => String(t).slice(0, 13) === hora);
  if(idx < 0) idx = 0;
  const pick = (arr, i) => (Array.isArray(arr) && arr[i] !== undefined && arr[i] !== null) ? arr[i] : null;

  let area = '';
  try{
    const gr = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=es`, {cache:'no-store'});
    if(gr.ok){
      const g = await gr.json();
      area = [g.locality || g.city, g.principalSubdivision, g.countryName].filter(Boolean).join(', ');
    }
  }catch(_e){ /* el nombre del área es opcional */ }

  return {
    lat, lon, area,
    updatedAt: new Date().toISOString(),
    code: cur.weather_code,
    temp: cur.temperature_2m,
    feels: cur.apparent_temperature,
    humidity: cur.relative_humidity_2m,
    precip: cur.precipitation,
    precipProb: pick(hourly.precipitation_probability, idx) ?? pick(daily.precipitation_probability_max, 0),
    cloud: cur.cloud_cover,
    pressure: cur.pressure_msl,
    wind: cur.wind_speed_10m,
    windDir: cur.wind_direction_10m,
    gust: cur.wind_gusts_10m,
    uv: pick(hourly.uv_index, idx) ?? pick(daily.uv_index_max, 0),
    visibility: pick(hourly.visibility, idx),
    max: pick(daily.temperature_2m_max, 0),
    min: pick(daily.temperature_2m_min, 0),
    sunrise: ((daily.sunrise || [])[0] || '').slice(11, 16),
    sunset: ((daily.sunset || [])[0] || '').slice(11, 16)
  };
}

async function cargarClima(){
  const fa = frenteActivo();
  if(!fa){ toast('Abra un proyecto para consultar el clima'); return; }
  const {fi, f} = fa;

  let pos = parseCoords(f.coordenadas);
  if(!pos){
    toast('Obteniendo ubicación del frente…', 4000);
    try{
      const g = await geoPos();
      pos = {lat:g.lat, lon:g.lon};
      if(!f.coordenadas) updFront(fi, 'coordenadas', `${g.lat.toFixed(6)}, ${g.lon.toFixed(6)}`);
    }catch(e){
      toast('Sin coordenadas: registre el ⌖ GPS del frente o escríbalas para consultar el clima', 5600);
      return;
    }
  }

  toast('Consultando clima del área exacta…', 5000);
  try{
    const data = await fetchClima(pos.lat, pos.lon);
    J().fronts[fi].climaData = data;
    save(); render();
    toast('Clima actualizado');
  }catch(e){
    console.error(e);
    toast('No se pudo consultar el clima. Verifique la conexión a internet.');
  }
}

function renderClimaBox(){
  const fa = frenteActivo();
  if(!fa) return '';
  const f = fa.f;
  const c = f.climaData;
  if(!c){
    return `<p class="muted" style="margin-top:12px">Aún no se ha consultado el clima de <b>${esc(f.nombre || 'este frente')}</b>.
      Registre las coordenadas del frente (o pulse ⌖ GPS) y luego <b>☀ Clima</b>.</p>`;
  }
  const [cond, ico] = wmo(c.code);
  const opc = c.precipProb === null ? '—' : nClima(c.precipProb) + ' %';
  const filas = [
    ['Área exacta', c.area || 'Sin nombre de área'],
    ['Coordenadas', `${Number(c.lat).toFixed(6)}, ${Number(c.lon).toFixed(6)}`],
    ['Condición', `${ico} ${cond}`],
    ['Temperatura', `${nClima(c.temp)} °C`],
    ['Sensación térmica', `${nClima(c.feels)} °C`],
    ['Máx. / Mín. del día', `${nClima(c.max)} °C / ${nClima(c.min)} °C`],
    ['Prob. de precipitaciones', opc],
    ['Precipitación', `${nClima(c.precip)} mm`],
    ['Humedad', `${nClima(c.humidity, 0)} %`],
    ['Viento', `a ${nClima(c.wind)} km/h · ${dirViento(c.windDir)}`],
    ['Ráfagas', `${nClima(c.gust)} km/h`],
    ['Nubosidad', `${nClima(c.cloud, 0)} %`],
    ['Presión atmosférica', `${nClima(c.pressure, 0)} hPa`],
    ['Visibilidad', c.visibility === null || c.visibility === undefined ? '—' : `${nClima(Number(c.visibility) / 1000)} km`],
    ['Índice UV', `${nClima(c.uv)}${nivelUV(c.uv)}`],
    ['Salida del sol', c.sunrise || '—'],
    ['Puesta del sol', c.sunset || '—']
  ].map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');

  const act = new Date(c.updatedAt);
  const actTxt = isNaN(act) ? '' : act.toLocaleString('es-CO', {day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'});
  const gLink = `https://www.google.com/search?q=${encodeURIComponent('clima ' + Number(c.lat).toFixed(5) + ',' + Number(c.lon).toFixed(5))}`;

  return `
  <div class="clima-box">
    <div class="clima-head">
      <b>${esc(c.area || 'Ubicación del frente')}</b>
      <span class="muted">${Number(c.lat).toFixed(5)}, ${Number(c.lon).toFixed(5)} · actualizado ${esc(actTxt)}</span>
    </div>
    <div class="clima-metrics">

/* ---------- Pestañas ---------- */
function renderTabs(){
  const j = J();
  let h = '<div class="tabs no-print">';
  j.fronts.forEach((f,i)=>{
    h += `<button class="tab" data-tab="${i}" onclick="setTab(${i})">${esc(f.nombre || 'Frente '+(i+1))}</button>`;
  });
  h += `<button class="tab" data-tab="resumen" onclick="setTab('resumen')">Resumen de jornada</button>`;
  h += `<button class="tab add" onclick="addFront()">＋ Agregar frente</button>`;
  h += '</div>';
  return h;
}

function renderFront(fi, f){
  return `<section class="front" data-idx="${fi}">

function addOperativo(fi){
  const cargo = document.getElementById('opCargo_'+fi).value;
  const cant  = document.getElementById('opCant_'+fi).value;
  if(!cargo || !cant){ toast('Seleccione cargo y cantidad'); return; }
  J().fronts[fi].personalOperativo.push({cargo, cantidad:cant});
  save(); render();
  toast('Personal operativo agregado');
}

/* ---------- D: Interventoría ---------- */
function renderC(fi, f){
  const cat = CAT().interventoria;
  const ofertados = cat.filter(p => p.ofertado);

  // La tabla fija de 4 perfiles ofertados solo aplica al proceso SI-SI-LP-004-2025
  const proj = getActiveProject();
  const esProcesoSII = /SI-SI-LP-004-2025/i.test((proj && proj.numeroProceso) || '');

  const filasOf = ofertados.map(p=>{
    const e = f.interventoria[p.id] || {presente:false, hora:'', justificacion:''};
    return `<tr>
      <td><b>${esc(p.cargo || 'Perfil')}</b><br><span class="muted">${esc(p.nombre)}</span></td>
      <td style="text-align:center;width:80px">
        <input type="checkbox" ${e.presente ? 'checked' : ''}
          onchange="togglePresente(${fi},'interventoria','${p.id}',this.checked)">
      </td>
      <td style="width:110px">
        <input type="time" value="${esc(e.hora||'')}" ${e.presente?'':'disabled'}

      </td>
      <td>
        <input value="${esc(e.justificacion||'')}" ${e.presente?'disabled':''}
          placeholder="${e.presente ? '—' : 'Excusa textual + hora (obligatorio si falta)'}"
          oninput="updPersona(${fi},'interventoria','${p.id}','justificacion',this.value)">
      </td>
    </tr>`;
  }).join('');

  const tablaOfertados = esProcesoSII ? `
    <h4>Verificación de los cuatro perfiles ofertados</h4>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Perfil ofertado</th><th>¿Presente?</th><th>Hora</th><th>Justificación de ausencia</th>
        </tr></thead>
        <tbody>${filasOf}</tbody>
      </table>
    </div>` : '';

  const otrosPresentes = Object.keys(f.interventoria).filter(id=>{
    const e = f.interventoria[id];
    if(!e || !e.presente) return false;
    const p = cat.find(x => x.id === id);
    // En SI-SI-LP-004-2025 los 4 ofertados ya están en la tabla fija
    return esProcesoSII ? (!p || !p.ofertado) : true;
  });

  const otrosDisp = cat.filter(p => {
    if(f.interventoria[p.id] && f.interventoria[p.id].presente) return false;
    return esProcesoSII ? !p.ofertado : true;
  });

  const chips = otrosDisp.length
    ? otrosDisp.map(p =>
        `<button class="chip" onclick="togglePresente(${fi},'interventoria','${p.id}',true)">＋ ${esc(p.nombre)}<span class="c">${esc(p.cargo||'')}</span></button>`
      ).join('')
    : '<span class="muted">Sin otros profesionales disponibles en el catálogo.</span>';

  const filasOtros = otrosPresentes.map(id=>{
    const p = getPersona('interventoria', id);
    const e = f.interventoria[id];
    return `<tr>
      <td><input value="${esc(p.nombre)}" oninput="updCat('interventoria','${id}','nombre',this.value)"></td>
      <td style="width:160px"><input value="${esc(p.cargo)}" list="cargosList" oninput="updCat('interventoria','${id}','cargo',this.value)"></td>
      <td style="width:150px"><input value="${esc(p.tarjetaProfesional||'')}" oninput="updCat('interventoria','${id}','tarjetaProfesional',this.value)" placeholder="N° tarjeta / resolución"></td>
      <td style="width:95px"><input type="time" value="${esc(e.hora||'')}" oninput="updPersona(${fi},'interventoria','${id}','hora',this.value)"></td>
      <td><input value="${esc(e.actividad||'')}" oninput="updPersona(${fi},'interventoria','${id}','actividad',this.value)"></td>
      <td><input value="${esc(e.obs||'')}" oninput="updPersona(${fi},'interventoria','${id}','obs',this.value)"></td>
      <td class="no-print" style="width:36px">
        <button class="mini danger" onclick="togglePresente(${fi},'interventoria','${id}',false)" title="Quitar del frente">✕</button>
      </td>
    </tr>`;
  }).join('');

  const preguntas = PREGUNTAS.map((q,i)=>`
    <label style="margin-top:8px">${i+1}. ${esc(q.t)}
      <textarea oninput="updSub(${fi},'preguntas','${q.key}','r',this.value)">${esc((f.preguntas[q.key]||{}).r || '')}</textarea>
    </label>`).join('');

  return `
  <div class="panel">
    <h2>D. Personal de la Interventoría en obra
      <span class="spacer"></span>
      <button class="mini no-print" onclick="modalCatalogo('interventoria')" title="Ver / limpiar catálogo">🗂 Catálogo</button>
    </h2>

    ${tablaOfertados}

    <h4>${esProcesoSII ? 'Otros profesionales de Interventoría' : 'Profesionales de Interventoría en obra'}</h4>
    <div class="chips">
      ${chips}
      <button class="chip new" onclick="modalPersona(${fi},'interventoria')">＋ Profesional nuevo</button>
    </div>
    ${otrosPresentes.length ? `
      <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr>
          <th>Nombre completo</th><th>Cargo / perfil</th><th>Tarjeta / Resolución</th><th>Hora</th>
          <th>Actividades que supervisa</th><th>Observaciones</th><th class="no-print"></th>
        </tr></thead>
        <tbody>${filasOtros}</tbody>
      </table>
      </div>` : '<p class="muted">Sin otros profesionales registrados.</p>'}

    <label style="margin-top:10px">Observaciones D
      <textarea oninput="updFront(${fi},'obsC',this.value)" placeholder="Notas sobre el personal de interventoría">${esc(f.obsC||'')}</textarea>
    </label>
    <h4>Preguntas obligatorias al personal de Interventoría presente</h4>
    ${preguntas}
    <div class="note">Transcriba la respuesta textual: es la evidencia que le da fuerza al control preventivo.</div>
  </div>`;
}

    <h2>${titulo}</h2>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Aspecto</th><th>¿Cumple / verificado?</th><th>Observación</th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
  </div>`;
}

function renderG(fi,f){ return tablaSimple(fi,f,'calidad',CALIDAD,'H. Calidad de la ejecución','Detalle de lo verificado'); }
function renderH(fi,f){ return tablaSimple(fi,f,'sst',SST_ITEMS,'I. Seguridad y salud en el trabajo','Observación'); }
function renderI(fi,f){ return tablaSimple(fi,f,'ambiental',AMB_ITEMS,'J. Gestión ambiental y tránsito','Observación'); }

/* ---------- J: Fotos ---------- */
function renderJ(fi, f){
  const filas = f.fotos.map((fo,ri)=>`
    <tr>
      <td style="width:40px;text-align:center">${ri+1}</td>
      <td><input value="${esc(fo.desc)}" oninput="updRow(${fi},'fotos',${ri},'desc',this.value)" placeholder="Descripción de la evidencia"></td>
      <td style="width:210px">
        <input type="file" accept="image/*" onchange="setFoto(${fi},${ri},this)" style="font-size:11px">
        ${fo.img ? `<img class="thumb" src="${fo.img}" alt="foto">` : (fo.archivo ? `<span class="muted">${esc(fo.archivo)}</span>` : '')}
      </td>
      <td class="no-print" style="width:36px"><button class="mini danger" onclick="delRow(${fi},'fotos',${ri})">✕</button></td>
    </tr>`).join('');

  return `
  <div class="panel">
    <h2>K. Evidencia fotográfica
      <span class="spacer"></span>
      <button class="mini no-print" onclick="addRow(${fi},'fotos',{desc:'',archivo:'',img:''})">＋ Foto</button>
    </h2>
    ${f.fotos.length ? `
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>N°</th><th>Descripción</th><th>Archivo</th><th class="no-print"></th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>` : '<p class="muted">Sin fotos registradas.</p>'}
    <div class="note">
      <b>Fotos obligatorias:</b> panorámica del frente · personal del Contratista identificable · personal de Interventoría ·
      bitácora y cronograma (o el sitio donde deberían estar) · maquinaria y preoperacional · actividad en ejecución ·
      señalización y PMT · documentos revisados · ausencias relevantes.
    </div>
  </div>`;
}

/* ---------- K: Hallazgos ---------- */
function renderK(fi, f){
  const filas = f.hallazgos.map((h,ri)=>`
    <tr>
      <td style="width:36px;text-align:center">${ri+1}</td>
      <td><input value="${esc(h.hallazgo)}" oninput="updRow(${fi},'hallazgos',${ri},'hallazgo',this.value)"></td>
      <td><input value="${esc(h.norma)}" oninput="updRow(${fi},'hallazgos',${ri},'norma',this.value)" placeholder="Obligación / norma"></td>
      <td><input value="${esc(h.evidencia)}" oninput="updRow(${fi},'hallazgos',${ri},'evidencia',this.value)" placeholder="Foto N°, documento, testimonio"></td>
      <td style="width:110px"><select onchange="updRow(${fi},'hallazgos',${ri},'gravedad',this.value)">${opts(['','Alta','Media','Baja'], h.gravedad)}</select></td>
      <td class="no-print" style="width:36px"><button class="mini danger" onclick="delRow(${fi},'hallazgos',${ri})">✕</button></td>
    </tr>`).join('');

  return `
  <div class="panel">
    <h2>L. Hallazgos y no conformidades
      <span class="spacer"></span>
      <button class="mini no-print" onclick="addRow(${fi},'hallazgos',{hallazgo:'',norma:'',evidencia:'',gravedad:''})">＋ Hallazgo</button>
    </h2>
    ${f.hallazgos.length ? `
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>N°</th><th>Hallazgo</th><th>Obligación / norma</th><th>Evidencia</th><th>Gravedad</th><th class="no-print"></th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>` : '<p class="muted">Sin hallazgos registrados.</p>'}
    <div class="note">
      <b>Gravedad — Alta:</b> ausencia de Interventoría, ausencia de bitácora/cronograma, actividad de calidad crítica sin supervisión, riesgo de seguridad.
      <b>Media:</b> documentos incompletos, señalización deficiente, ausencia de perfiles secundarios.
      <b>Baja:</b> orden y aseo, detalles de acabado.
    </div>
  </div>`;
}

/* ---------- L: Observaciones generales ---------- */
function renderL(fi, f){
  return `
  <div class="panel">
    <h2>M. Observaciones generales y recomendaciones</h2>
    <textarea style="min-height:90px" oninput="updFront(${fi},'obsGenerales',this.value)"
      placeholder="Observaciones del frente, recomendaciones, compromisos...">${esc(f.obsGenerales)}</textarea>
  </div>`;
}

/* ---------- M: Firmas ---------- */
function profesionalesFrente(fi){
  const f = J().fronts[fi];
  const out = [];
  const c = CAT();
  (c.contratista || []).forEach(p=>{
    if(p.nombre && f.contratista[p.id] && f.contratista[p.id].presente)
      out.push({nombre:p.nombre, cargo:p.cargo||'', tarjeta:p.tarjetaProfesional||''});
  });
  (c.interventoria || []).forEach(p=>{
    if(p.nombre && f.interventoria[p.id] && f.interventoria[p.id].presente)
      out.push({nombre:p.nombre, cargo:p.cargo||'', tarjeta:p.tarjetaProfesional||''});
  });
  ((getActiveProject()||{}).ingenierosVtc || []).forEach(p=>{
    if(p.nombre) out.push({nombre:p.nombre, cargo:p.cargo||'', tarjeta:p.tarjeta||''});
  });
  return out.filter(p=>p.cargo);
}

function renderM(fi, f){
  if(!Array.isArray(f.firmas) || !f.firmas.length) f.firmas = [blankFirma()];

  // Lista de profesionales: solo los que se registraron (presentes) en este frente + ingenieros VTC
  const todos = profesionalesFrente(fi);
  const cargosUnicos = [...new Set(todos.map(p=>p.cargo))];

  const filas = f.firmas.map((fm,ri)=>{
    const current = fm.rol || '';
    return `<tr>
      <td style="min-width:240px">
        <select onchange="setFirmaCargo(${fi},${ri},this.value)">
          <option value="">— Seleccionar profesional —</option>
          ${cargosUnicos.map(c=>`<option value="${esc(c)}" ${current===c?'selected':''}>${esc(c)}</option>`).join('')}
          ${current && !cargosUnicos.includes(current) ? `<option value="${esc(current)}" selected>${esc(current)}</option>` : ''}
        </select>
        <input value="${esc(fm.nombre)}" placeholder="Nombre completo" oninput="updRow(${fi},'firmas',${ri},'nombre',this.value)" style="margin-top:4px;font-size:11.5px">
        <input value="${esc(fm.tarjeta)}" placeholder="Tarjeta profesional / resolución" oninput="updRow(${fi},'firmas',${ri},'tarjeta',this.value)" style="margin-top:3px;font-size:11.5px">
      </td>
      <td style="width:170px;text-align:center">
        ${fm.firmaImg
          ? `<img class="thumb sign" src="${fm.firmaImg}" onclick="openSignature(${fi},${ri})" alt="firma">`
          : `<button class="mini no-print" onclick="openSignature(${fi},${ri})">✍ Firmar</button>`}
      </td>
      <td style="width:100px"><input type="time" value="${esc(fm.hora)}" oninput="updRow(${fi},'firmas',${ri},'hora',this.value)"></td>
      <td class="no-print" style="width:36px"><button class="mini danger" onclick="delRow(${fi},'firmas',${ri})" title="Quitar firma">✕</button></td>
    </tr>`;
  }).join('');

  const negativas = Array.isArray(f.negativas) ? f.negativas : (f.negativas = []);
  const filasNeg = negativas.map((n,ri)=>`
    <tr>
      <td><input value="${esc(n.nombre||'')}" placeholder="Nombre completo" oninput="updRow(${fi},'negativas',${ri},'nombre',this.value)"></td>
      <td><input value="${esc(n.cargo||'')}" placeholder="Cargo / entidad" oninput="updRow(${fi},'negativas',${ri},'cargo',this.value)"></td>
      <td><input value="${esc(n.tarjeta||'')}" placeholder="Tarjeta / cédula" oninput="updRow(${fi},'negativas',${ri},'tarjeta',this.value)"></td>
      <td style="min-width:200px"><input value="${esc(n.motivo||'')}" placeholder="Motivo textual de la negativa" oninput="updRow(${fi},'negativas',${ri},'motivo',this.value)"></td>
      <td style="width:100px"><input type="time" value="${esc(n.hora||'')}" oninput="updRow(${fi},'negativas',${ri},'hora',this.value)"></td>
      <td class="no-print" style="width:36px"><button class="mini danger" onclick="delRow(${fi},'negativas',${ri})" title="Quitar">✕</button></td>
    </tr>`).join('');

  return `
  <div class="panel">
    <h2>N. Firmas
      <span class="spacer"></span>
      <button class="mini no-print" onclick="addRow(${fi},'firmas',blankFirma())">＋ Firma</button>
    </h2>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Cargo + profesional</th><th>Firma</th><th>Hora</th><th></th></tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>
    <div class="note">Use el botón ✍ para abrir el lienzo de firma digital. Si alguien no firma, regístrelo abajo en la constancia de negativa.</div>

    <h4>Constancia de negativa a firmar</h4>
    <p class="muted" style="margin:0 0 8px">Registre aquí a los profesionales del Contratista o de la Interventoría que se negaron a firmar el documento de visitas.</p>
    <div class="tbl-wrap">
      <table class="tbl">
        <thead><tr><th>Nombre</th><th>Cargo / entidad</th><th>Tarjeta / cédula</th><th>Motivo textual</th><th>Hora</th><th class="no-print"></th></tr></thead>
        <tbody>${filasNeg || '<tr><td colspan="6" class="muted" style="text-align:center;padding:12px">Sin negativas registradas.</td></tr>'}</tbody>
      </table>
    </div>
    <button class="mini no-print" style="margin-top:10px" onclick="addRow(${fi},'negativas',{nombre:'',cargo:'',tarjeta:'',motivo:'',hora:''})">＋ Registrar negativa</button>

    <h4>Hora de salida del frente</h4>
    <div class="grid3">
      <label>Hora de salida (último dato de la visita)
        <input type="time" value="${esc(f.horaSalida)}" oninput="updFront(${fi},'horaSalida',this.value)">
      </label>
    </div>
    <div class="note">Registre la hora de salida al terminar: es el último dato que se diligencia antes de cerrar la visita.</div>
  </div>`;
}

function setFirmaCargo(fi, ri, cargo){
  const f = J().fronts[fi];
  f.firmas[ri].rol = cargo;
  const m = profesionalesFrente(fi).find(p=>p.cargo === cargo);
  if(m){
    f.firmas[ri].nombre = m.nombre;
    f.firmas[ri].tarjeta = m.tarjeta;
  }
  save(); render();
}

/* ---------- Resumen ---------- */
function resumenFila(f){
  const contratista = Object.keys(f.contratista).filter(id => f.contratista[id].presente).length;
  const interv = Object.keys(f.interventoria).filter(id => f.interventoria[id].presente).length;
  const bitacora = (f.docs['Bitácora de obra'] || {}).enObra || 'No';
  const cronograma = (f.docs['Cronograma de actividades'] || {}).enObra || 'No';
  const act = (f.actividades.find(a => a.ejecucion === 'Sí') || f.actividades[0] || {}).actividad || '—';
  const critico = (f.hallazgos.find(h => h.gravedad === 'Alta') || {}).hallazgo || '';
  return {contratista, interv, bitacora, cronograma, act, critico};
}

function renderResumen(){
  const j = J();
  if(!j) return '';
  const filas = j.fronts.map((f,i)=>{
    const r = resumenFila(f);
    return `<tr>
      <td><b>${esc(f.nombre || 'Frente '+(i+1))}</b></td>
      <td>${esc(f.horaLlegada || '—')}${f.horaSalida ? ' · ' + esc(f.horaSalida) : ''}</td>
      <td>${r.contratista ? 'Sí ('+r.contratista+')' : 'No'}</td>
      <td>${r.interv ? 'Sí ('+r.interv+')' : 'No'}</td>
      <td style="color:${r.bitacora==='Sí'?'var(--ok)':'var(--bad)'}">${esc(r.bitacora)}</td>
      <td style="color:${r.cronograma==='Sí'?'var(--ok)':'var(--bad)'}">${esc(r.cronograma)}</td>
      <td>${esc(r.act)}</td>
      <td style="color:${r.critico?'var(--bad)':'inherit'}">${esc(r.critico || '—')}</td>
    </tr>`;
  }).join('');

  const checklist = CHECKLIST.map((c,i)=>{
    const on = !!j.checklist[i];
    return `<label class="check-item ${on?'on':''}">
      <input type="checkbox" ${on?'checked':''} onchange="toggleChecklist(${i},this.checked);this.closest('label').classList.toggle('on',this.checked)">
      <span>${esc(c)}</span>
    </label>`;
  }).join('');

  return `<section class="front" data-idx="resumen">
    <div class="panel">
      <h2>Resumen de jornada · múltiples frentes</h2>
      <div class="tbl-wrap">
        <table class="tbl">
          <thead><tr>
            <th>Frente</th><th>Hora</th><th>Contratista</th><th>Interventoría</th>
            <th>Bitácora</th><th>Cronograma</th><th>Actividad principal</th><th>Hallazgo crítico</th>
          </tr></thead>
          <tbody>${filas}</tbody>
        </table>
      </div>
    </div>

    <div class="panel">
      <h2>Lista de chequeo rápida antes de salir del frente</h2>
      <div class="check-list">${checklist}</div>
      <div class="note">Marca cada punto; si falta uno, el CP pierde fuerza.</div>
    </div>

    <div class="panel">
      <h2>Observaciones generales de la jornada</h2>
      <textarea style="min-height:110px" oninput="updJ('obsGenerales',this.value)"
        placeholder="Conclusiones de la jornada, compromisos, requerimientos a la Interventoría...">${esc(j.obsGenerales)}</textarea>
    </div>
  </section>`;
}

/* =========================================================
   ARRANQUE
   ========================================================= */
function init(){
  initDB();
  render();
}
init();
</script>
</body>
</html>
